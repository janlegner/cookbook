site_name: Cookbook
site_description: Personal cookbook
site_author: Jan Legner
docs_dir: docs

theme:
  name: material
  language: en
  icon:
    logo: material/silverware-fork-knife
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

exclude_docs: |
  recipes/_template.*

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: cs
          name: Čeština
          build: true
          site_name: Kuchařka
          nav_translations:
            Home: Domů
            Recipes: Recepty
            About: O kuchařce

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Recipes:
      - recipes/index.md
      - Bramboráky: recipes/bramboraky.md
      - Vanilkové rohlíky: recipes/vanilkove-rohliky.md
  - About: about.md
